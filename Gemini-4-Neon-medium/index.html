<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hvordan GPS virker — En visuell reise gjennom tid, rom og geometri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Full-bleed paper & crayon stage -->
    <canvas id="stage" aria-label="Interaktiv strektegning som forklarer hvordan GPS fungerer"></canvas>

    <!-- Top-left title & fancy subtitle (no top navigation) -->
    <header class="title-block">
      <h1 class="main-title">Hvordan GPS virker</h1>
      <p class="fancy-subtitle">
        <span class="subtitle-ornament">~</span>
        En visuell reise i tid, rom, geometri og lysets hastighet
        <span class="subtitle-ornament">~</span>
      </p>
    </header>

    <!-- Calm narration text gently fading in/out on the right side -->
    <aside class="narration-panel" aria-live="polite">
      <div class="narration-chapter-tag" id="narrationTag">Kapittel 1</div>
      <div class="narration-content" id="narrationContent">
        <h2 class="narration-heading" id="narrationHeading"></h2>
        <p class="narration-body" id="narrationBody"></p>
        <p class="narration-note" id="narrationNote"></p>
      </div>
    </aside>

    <!-- Bottom-center video player & chapter selector -->
    <div class="player-dock" role="region" aria-label="Videoavspiller og kapittelvelger">
      <div class="player-timeline-wrap" id="timelineWrap">
        <div class="timeline-tooltip" id="timelineTooltip"></div>
        <div class="timeline-track" id="timelineTrack">
          <div class="timeline-progress" id="timelineProgress"></div>
          <div class="timeline-markers" id="timelineMarkers"></div>
          <div class="timeline-thumb" id="timelineThumb"></div>
        </div>
      </div>

      <div class="player-controls">
        <div class="controls-left">
          <button class="ctrl-btn" id="btnPrev" title="Forrige kapittel (Pil venstre)" aria-label="Forrige kapittel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 20L9 12l10-8v16z" />
              <line x1="5" y1="19" x2="5" y2="5" />
            </svg>
          </button>

          <button class="ctrl-btn ctrl-play" id="btnPlay" title="Spill av / Pause (Mellomrom)" aria-label="Spill av eller pause">
            <svg id="iconPause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1.2" />
              <rect x="14" y="4" width="4" height="16" rx="1.2" />
            </svg>
            <svg id="iconPlay" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none">
              <path d="M7 4.8v14.4c0 .8.9 1.3 1.6.9l11.2-7.2c.6-.4.6-1.4 0-1.8L8.6 3.9C7.9 3.5 7 4 7 4.8z" />
            </svg>
          </button>

          <button class="ctrl-btn" id="btnNext" title="Neste kapittel (Pil høyre)" aria-label="Neste kapittel">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4l10 8-10 8V4z" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
          </button>

          <span class="time-readout" id="timeReadout">0:00 / 2:30</span>
        </div>

        <div class="controls-center">
          <button class="chapter-pill" id="chapterMenuBtn" title="Velg kapittel" aria-haspopup="true" aria-expanded="false">
            <span class="chapter-pill-index" id="chapterPillIndex">1/9</span>
            <span class="chapter-pill-title" id="chapterPillTitle">2D: Én satellitt</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15" />
            </svg>
          </button>

          <div class="chapter-popover" id="chapterPopover" role="menu">
            <!-- Populated dynamically by app.js -->
          </div>
        </div>

        <div class="controls-right">
          <button class="ctrl-btn ctrl-speed" id="btnSpeed" title="Avspillingshastighet">1x</button>
          <button class="ctrl-btn" id="btnFullscreen" title="Fullskjerm (F)" aria-label="Fullskjerm">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Subtle UiO reference footer bottom-right -->
    <footer class="source-footer">
      Kilde:
      <a href="https://www.uio.no/studier/emner/matnat/astro/AST2000/h24/blogger/bloggen-til-ellen-og-erica/9-generell-relativitet/gps(1).html"
         target="_blank" rel="noopener noreferrer">
        UiO · AST2000 — GPS og relativitet
      </a>
    </footer>
  </div>

  <script defer src="js/sketch.js"></script>
  <script defer src="js/spheres3d.js"></script>
  <script defer src="js/scenes.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
